{% extends "base_biuro.html" %}
{% block tytul %}Dodaj kompleks{% endblock %}
{% block tresc %}
<h1>Dodaj kompleks działek</h1>
<p class="okres">Kompleks to sąsiadujące działki traktowane jako całość: jedno badanie gleby, wspólna powierzchnia i limit.</p>
<form method="post" class="formularz">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="szeroko">Nazwa kompleksu <input name="nazwa" required value="{{ f.nazwa or '' }}" placeholder="np. Wola Solecka – dz. 53–98"></label>
    <label class="szeroko">Numery działek (oddzielone przecinkami) <input name="dzialki" required value="{{ f.dzialki or '' }}" placeholder="53, 54/1, 54/2, 54/3, 98"></label>
    <label>Powierzchnia [ha] <input name="powierzchnia_ha" required inputmode="decimal" value="{{ f.powierzchnia_ha or '' }}" placeholder="3,86"></label>
    <label>Obręb <input name="obreb" value="{{ f.obreb or '' }}"></label>
    <label>Gmina <input name="gmina" value="{{ f.gmina or '' }}"></label>
    <label>Kategoria gruntu
        <select name="kategoria_gruntu">
            {% for kat in ['grunt lekki', 'grunt średni', 'grunt ciężki'] %}<option {% if f.kategoria_gruntu == kat %}selected{% endif %}>{{ kat }}</option>{% endfor %}
        </select>
    </label>
    <label>Właściciel / władający <input name="wlasciciel" value="{{ f.wlasciciel or '' }}"></label>
    <label class="szeroko">Uwagi <textarea name="uwagi" rows="2">{{ f.uwagi or '' }}</textarea></label>
    <button class="przycisk szeroko" type="submit">Zapisz kompleks</button>
</form>
{% endblock %}
