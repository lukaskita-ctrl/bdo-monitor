<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e4a3b">
    <title>{% block tytul %}BDO Monitor{% endblock %} – Zielony Obieg</title>
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="pasek">
        <div class="pasek-wnetrze">
            <div class="marka">
                <img src="{{ url_for('static', filename='icon.png') }}" alt="">
                <span>BDO Monitor, Zielony Obieg</span>
            </div>
            <nav class="zakladki" aria-label="Sekcje">
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Karty</a>
                <a href="{{ url_for('stats_page') }}" {% if request.endpoint == 'stats_page' %}aria-current="page"{% endif %}>Statystyki</a>
            </nav>
        </div>
    </header>
    <main>
        {% with komunikaty = get_flashed_messages(with_categories=true) %}
          {% for kategoria, tekst in komunikaty %}
            <div class="komunikat komunikat-{{ kategoria }}" role="status">{{ tekst }}</div>
          {% endfor %}
        {% endwith %}
        {% block tresc %}{% endblock %}
    </main>
</body>
</html>
